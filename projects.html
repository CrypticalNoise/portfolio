<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="CrypticalNoise — Roblox 3D artist, environment builder and game asset creator."
  >

  <title>Projects — CrypticalNoise</title>


  <!-- FAVICON -->

  <link
    rel="icon"
    type="image/png"
    href="assets/iconB.png"
  >


  <!-- GOOGLE FONT -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >


  <!-- MAIN CSS -->

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body id="top">


  <!-- =========================
       HEADER
  ========================== -->

  <header class="site-header">

    <a
      class="brand"
      href="index.html"
      aria-label="CrypticalNoise home"
    >
      crypticalnoise<span>.</span>
    </a>


    <nav
      class="desktop-nav"
      aria-label="Main navigation"
    >

      <a href="index.html">
        Home
      </a>

      <a
        class="active"
        href="projects.html"
      >
        Projects
      </a>

      <a href="index.html#about">
        About
      </a>

      <a href="index.html#contact">
        Contact
      </a>

    </nav>


    <!-- MOBILE MENU BUTTON -->

    <button
      class="menu-toggle"
      aria-label="Open menu"
      aria-expanded="false"
    >

      <span></span>
      <span></span>

    </button>

  </header>



  <!-- =========================
       MOBILE MENU
  ========================== -->

  <div class="mobile-menu">

    <a href="index.html">
      Home
    </a>

    <a href="projects.html">
      Projects
    </a>

    <a href="index.html#about">
      About
    </a>

    <a href="index.html#contact">
      Contact
    </a>

  </div>



  <!-- =========================
       MAIN
  ========================== -->

  <main>


    <!-- =========================
         PROJECT HERO
    ========================== -->

    <section class="projects-hero">

      <div>

        <p class="eyebrow">
          PORTFOLIO
        </p>

        <h1>
          Built to<br>
          <span>stand out.</span>
        </h1>

      </div>


      <p>
        Maps and game-ready assets
        built for Roblox experiences.
      </p>

    </section>



    <!-- =========================
         PROJECTS
    ========================== -->

    <section class="work section">


      <!-- FILTERS -->

      <div
        class="filters"
        role="tablist"
        aria-label="Project filters"
      >

        <button
          class="filter active"
          data-filter="maps"
        >
          Maps
        </button>

        <button
          class="filter"
          data-filter="assets"
        >
          Assets
        </button>

      </div>



      <!-- =========================
           PROJECT GRID
           JavaScript fills this
      ========================== -->

      <div
        class="project-grid"
        id="project-grid"
      ></div>


    </section>

  </main>



  <!-- =========================
       PROJECT MODAL
  ========================== -->

  <div
    class="modal"
    aria-hidden="true"
  >

    <button
      class="modal-close"
      aria-label="Close project"
    >
      ×
    </button>


    <div class="modal-content">


      <!-- PROJECT IMAGE -->

      <div class="modal-image">

        <img
          src=""
          alt=""
        >

      </div>


      <!-- PROJECT INFORMATION -->

      <div class="modal-info">

        <p
          class="eyebrow"
          id="modal-type"
        ></p>


        <h2
          id="modal-title"
        ></h2>


        <p
          id="modal-description"
        ></p>


        <a
          href="index.html#contact"
          class="button button-solid modal-contact"
        >
          Discuss a project
        </a>

      </div>

    </div>

  </div>



  <!-- =========================
       FOOTER
  ========================== -->

  <footer>

    <span>
      © <span id="year"></span> CrypticalNoise
    </span>

    <span>
      ROBLOX 3D ART · MAPS · ASSETS
    </span>

    <a href="#top">
      BACK TO TOP ↑
    </a>

  </footer>



  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <!-- Project data MUST load first -->

  <script src="projects.js"></script>

  <!-- Main website JavaScript -->

  <script src="script.js"></script>


</body>

</html>
